services:
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: xwiki-vector-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-xwiki_vector}
      POSTGRES_USER: ${DB_USERNAME:-xwiki_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-xwiki_password}
    ports:
      - "${DB_PORT:-6432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-xwiki_user} -d ${DB_NAME:-xwiki_vector}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - pgvector_data:/var/lib/postgresql/data

  xwiki:
    image: xwiki:15.10.15-postgres-tomcat
    container_name: xwiki-postgres-tomcat-web
    restart: unless-stopped
    depends_on:
      - xwiki_db
    environment:
      DB_USER: ${XWIKI_DB_USER:-xwiki}
      DB_PASSWORD: ${XWIKI_DB_PASSWORD:-xwiki}
      DB_HOST: xwiki_db
      DB_DATABASE: ${XWIKI_DB_NAME:-xwiki}
    ports:
      - "${XWIKI_PORT:-8080}:8080"

  xwiki_db:
    image: postgres:17
    container_name: xwiki-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${XWIKI_DB_NAME:-xwiki}
      POSTGRES_USER: ${XWIKI_DB_USER:-xwiki}
      POSTGRES_PASSWORD: ${XWIKI_DB_PASSWORD:-xwiki}
    volumes:
      - xwiki_db_data:/var/lib/postgresql/data

volumes:
  pgvector_data:
  xwiki_db_data:
