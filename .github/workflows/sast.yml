name: Security

on:
  push:
    branches:
      - main
      - master
      - develop
      - security-gate
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Create report directories
        run: |
          mkdir -p reports/sast
          mkdir -p reports/sca

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Generate Maven dependency inventory
        run: |
          ./mvnw -DskipTests dependency:list -DoutputFile=reports/sca/dependency-list.txt
          ./mvnw -DskipTests dependency:tree -DoutputFile=reports/sca/dependency-tree.txt

      - name: Generate CycloneDX SBOM
        run: |
          ./mvnw -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom \
            -Dcyclonedx.outputFormat=json \
            -Dcyclonedx.outputName=bom \
            -Dcyclonedx.outputDirectory=reports/sca \
            -Dcyclonedx.skipAttach=true

      - name: Debug SBOM output locations
        if: always()
        run: |
          echo "Inspecting possible SBOM locations..."
          ls -la reports/sca || true
          ls -la target || true

      - name: Normalize SBOM path
        run: |
          if [ -f reports/sca/bom.json ]; then
            echo "SBOM file already exists at reports/sca/bom.json"
          elif [ -f target/bom.json ]; then
            cp target/bom.json reports/sca/bom.json
            echo "SBOM copied from target/bom.json"
          elif [ -f bom.json ]; then
            cp bom.json reports/sca/bom.json
            echo "SBOM copied from bom.json"
          else
            echo "CycloneDX SBOM file was not found in expected locations."
            echo "Listing candidate files:"
            find . -maxdepth 4 -type f \( -name "bom.json" -o -name "bom.xml" -o -name "*cyclonedx*" \) || true
            exit 1
          fi

      - name: Build SAST image
        run: docker build -f Dockerfile.sast -t xwiki-sast .

      - name: Warm up Maven dependency cache
        run: ./mvnw -P sast -DskipTests dependency:go-offline

      - name: Compile project
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            xwiki-sast \
            "mvn -DskipTests compile"

      - name: Generate XML report
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            xwiki-sast \
            "mvn -P sast -DskipTests -Dspotbugs.xmlOutput=true -Dspotbugs.htmlOutput=false -Dspotbugs.sarifOutput=false spotbugs:spotbugs"

      - name: Generate HTML report
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            xwiki-sast \
            "mvn -P sast -DskipTests -Dspotbugs.xmlOutput=false -Dspotbugs.htmlOutput=true -Dspotbugs.outputDirectory=target/site spotbugs:spotbugs"

      - name: Generate SARIF report
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            xwiki-sast \
            "mvn -P sast -DskipTests -Dspotbugs.xmlOutput=false -Dspotbugs.htmlOutput=false -Dspotbugs.sarifOutput=true -Dspotbugs.sarifOutputDirectory=target -Dspotbugs.sarifOutputFilename=spotbugs.sarif.json spotbugs:spotbugs"

      - name: Copy SAST reports
        run: |
          cp target/spotbugsXml.xml reports/sast/spotbugs-report.xml
          cp target/site/spotbugs.html reports/sast/spotbugs-report.html
          cp target/spotbugs.sarif.json reports/sast/spotbugs.sarif.json

      - name: Install Trivy CLI
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.3
          cache: true

      - name: Run Trivy scan against SBOM (JSON)
        run: |
          trivy sbom \
            --scanners vuln \
            --format json \
            --output reports/sca/trivy-results.json \
            reports/sca/bom.json

      - name: Run Trivy scan against SBOM (table)
        run: |
          trivy sbom \
            --scanners vuln \
            --format table \
            --output reports/sca/trivy-results.txt \
            reports/sca/bom.json

      - name: Run Trivy scan against SBOM (SARIF)
        run: |
          trivy sbom \
            --scanners vuln \
            --format sarif \
            --output reports/sca/trivy-results.sarif \
            reports/sca/bom.json

      - name: SAST security gate
        id: sast_gate
        continue-on-error: true
        run: python3 scripts/security_gate.py --mode sast

      - name: SCA security gate
        id: sca_gate
        if: always()
        continue-on-error: true
        run: python3 scripts/security_gate.py --mode sca --sca-blocking-severities CRITICAL

      - name: Enforce security gates
        if: always()
        run: |
          if [ "${{ steps.sast_gate.outcome }}" != "success" ] || [ "${{ steps.sca_gate.outcome }}" != "success" ]; then
            echo "Security gate failed. Check SAST and SCA reports for details."
            exit 1
          fi

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            reports/sast/
            reports/sca/
          if-no-files-found: error

      - name: Upload SpotBugs SARIF to GitHub Code Scanning
        if: always() && hashFiles('reports/sast/spotbugs.sarif.json') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/sast/spotbugs.sarif.json

      - name: Upload Trivy SARIF to GitHub Code Scanning
        if: always() && hashFiles('reports/sca/trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/sca/trivy-results.sarif
