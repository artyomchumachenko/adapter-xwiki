name: DAST

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - security-gate
      - "release/**"
  workflow_dispatch:

jobs:
  dast:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    permissions:
      contents: read
    env:
      DAST_BLOCKING_SEVERITIES: ${{ vars.DAST_BLOCKING_SEVERITIES || 'CRITICAL' }}
      DAST_FAIL_OPEN_ON_PR: ${{ vars.DAST_FAIL_OPEN_ON_PR || 'true' }}
      DAST_TARGET_URL: ${{ vars.DAST_TARGET_URL }}
      DAST_TARGET_URL_SECRET: ${{ secrets.DAST_TARGET_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install gate dependencies
        run: python -m pip install pyyaml

      - name: Create report directories
        run: |
          New-Item -ItemType Directory -Path reports/dast -Force | Out-Null

      - name: Resolve target URL
        id: resolve_target
        run: |
          $targetUrl = $env:DAST_TARGET_URL
          if ([string]::IsNullOrWhiteSpace($targetUrl)) {
            $targetUrl = $env:DAST_TARGET_URL_SECRET
          }

          if ([string]::IsNullOrWhiteSpace($targetUrl)) {
            "target_url_missing=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "target_url=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "::warning::DAST target URL is not configured (vars/secrets: DAST_TARGET_URL)."
            exit 0
          }

          $targetUrl = $targetUrl.TrimEnd('/')
          "target_url_missing=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "target_url=$targetUrl" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Evaluate fail mode
        id: fail_mode
        run: |
          if ("${{ github.event_name }}" -eq "pull_request" -and $env:DAST_FAIL_OPEN_ON_PR -eq "true") {
            "target_required=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "mode=fail-open" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "target_required=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "mode=fail-closed" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Health check target
        id: health
        if: steps.resolve_target.outputs.target_url_missing != 'true'
        continue-on-error: true
        run: |
          $healthUrl = "${{ steps.resolve_target.outputs.target_url }}/actuator/health"
          curl.exe --fail --show-error --silent --max-time 20 $healthUrl -o reports/dast/health.json

      - name: Decide target availability
        id: availability
        run: |
          if ("${{ steps.resolve_target.outputs.target_url_missing }}" -eq "true") {
            "target_available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          if ("${{ steps.health.outcome }}" -eq "success") {
            "target_available=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "target_available=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Run OWASP ZAP baseline
        if: steps.availability.outputs.target_available == 'true'
        run: |
          $searchTarget = "${{ steps.resolve_target.outputs.target_url }}/api/xwiki/search?query=security-test&limit=1"
          docker run --rm `
            -v "${{ github.workspace }}:/zap/wrk" `
            ghcr.io/zaproxy/zaproxy:stable `
            zap-baseline.py `
            -t "$searchTarget" `
            -m 3 `
            -J "reports/dast/zap-report.json" `
            -r "reports/dast/zap-report.html" `
            -I `
            -z "-config globalexcludeurl.url_list.url(0).regex=.*\\/api\\/(?!xwiki\\/search(\\?.*)?$).* -config globalexcludeurl.url_list.url(0).description=exclude-non-search-api -config globalexcludeurl.url_list.url(0).enabled=true"

      - name: Build API target list for Nuclei
        if: steps.availability.outputs.target_available == 'true'
        run: |
          $targetUrl = "${{ steps.resolve_target.outputs.target_url }}"
          $paths = Get-Content -LiteralPath "scripts/dast-api-targets.txt" | Where-Object { $_ -and -not $_.StartsWith("#") }
          $fullTargets = $paths | ForEach-Object { "$targetUrl$_" }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines((Join-Path $PWD "reports/dast/nuclei-targets.txt"), $fullTargets, $utf8NoBom)

      - name: Run Nuclei
        if: steps.availability.outputs.target_available == 'true'
        run: |
          docker run --rm `
            -v "${{ github.workspace }}:/workspace" `
            projectdiscovery/nuclei:latest `
            -l /workspace/reports/dast/nuclei-targets.txt `
            -json-export /workspace/reports/dast/nuclei-report.json

      - name: Run DAST gate
        id: dast_gate
        if: steps.availability.outputs.target_available == 'true'
        continue-on-error: true
        run: |
          python scripts/security_gate.py `
            --mode dast `
            --zap-report reports/dast/zap-report.json `
            --nuclei-report reports/dast/nuclei-report.json `
            --dast-suppressions reports/dast/suppressions.yml `
            --dast-blocking-severities "$env:DAST_BLOCKING_SEVERITIES"

      - name: Enforce DAST policy
        if: always()
        run: |
          Write-Host "Policy mode:           ${{ steps.fail_mode.outputs.mode }}"
          Write-Host "Target available:      ${{ steps.availability.outputs.target_available }}"
          Write-Host "DAST gate outcome:     ${{ steps.dast_gate.outcome }}"
          Write-Host "Event:                 ${{ github.event_name }}"

          if ("${{ steps.availability.outputs.target_available }}" -ne "true") {
            if ("${{ steps.fail_mode.outputs.target_required }}" -eq "true") {
              Write-Host "Blocking: DAST target is unavailable in fail-closed mode."
              exit 1
            }

            Write-Host "::warning::DAST target is unavailable. Fail-open mode is active for this event."
            exit 0
          }

          if ("${{ steps.dast_gate.outcome }}" -ne "success") {
            Write-Host "Blocking: DAST gate failed."
            exit 1
          }

      - name: Upload DAST artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports
          path: |
            reports/dast/
          if-no-files-found: warn
